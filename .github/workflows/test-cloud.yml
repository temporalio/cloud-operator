name: test-cloud

on:
  schedule:
    # Runs at 16:00 UTC daily.
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test-cloud:
    name: test-cloud
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: temporal-cloud-e2e
    concurrency:
      group: test-cloud

    steps:
    - name: checkout-code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        check-latest: true
        cache: true

    - name: install-envsubst
      run: sudo apt-get update && sudo apt-get install -y gettext-base

    # Set the toolchain to auto so that temporal-cloud CLI can use Go 1.27
    # TODO: remove GOTOOLCHAIN=auto once go.mod requires Go 1.27 or later.
    - name: run-tests
      run: GOTOOLCHAIN=auto make test-cloud
      env:
        TEMPORAL_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLOUD_API_KEY }}
        RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
