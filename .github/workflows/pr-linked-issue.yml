name: pr-linked-issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:

  linked-issue:
    name: linked-issue
    runs-on: ubuntu-latest
    # Dependabot and changelog bot PRs don't need an issue.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'temporal-cicd[bot]'

    steps:
    - name: check-closing-keyword
      env:
        TITLE: ${{ github.event.pull_request.title }}
        BODY: ${{ github.event.pull_request.body }}
      run: |
        # chore, ci and build PRs don't need an issue.
        if printf '%s' "$TITLE" | grep -Eiq '^(chore|ci|build)(\([^)]*\))?!?:'; then
          echo "Skipped: '$TITLE' doesn't need a linked issue."
          exit 0
        fi
        if printf '%s' "$BODY" | grep -Eiq '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?\s+(\S+/\S+#|#|https://github\.com/\S+/issues/)[0-9]+'; then
          exit 0
        fi
        echo "::error::No linked issue. Add 'Closes #N' (or Fixes/Resolves) to the PR description, or use a chore/ci/build title prefix."
        exit 1
