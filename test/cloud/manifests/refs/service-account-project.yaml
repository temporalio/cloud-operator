---
apiVersion: cloud.temporal.io/v1alpha1
kind: ServiceAccount
metadata:
  name: tro-e2e-${RUN_ID}-refs-proj-sa
spec:
  displayName: tro-e2e-${RUN_ID}-refs-proj-sa
  description: Cloud Operator test for resources applied together by ref.
  projectScopedAccess:
    project:
      ref:
        name: tro-e2e-${RUN_ID}-refs-p
    access:
      role: Read
    namespaceAccesses:
      - namespace:
          ref:
            name: tro-e2e-${RUN_ID}-refs-ns
        access:
          permission: Write
