---
apiVersion: cloud.temporal.io/v1alpha1
kind: APIKey
metadata:
  name: tro-e2e-${RUN_ID}-refs-key
spec:
  displayName: tro-e2e-${RUN_ID}-refs-key
  description: Cloud Operator test for resources applied together by ref.
  owner:
    serviceAccount:
      ref:
        name: tro-e2e-${RUN_ID}-refs-proj-sa
  expiryTime: "${TEST_API_KEY_EXPIRY}"
  token:
    secretKeyRef:
      name: tro-e2e-${RUN_ID}-refs-key-token
