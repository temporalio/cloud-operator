name: namespace-delete-protection
description: |
  Deleting a Namespace resource with delete protection on keeps the resource
  and the Temporal Cloud namespace, and the operator sets a Stalled condition.
  Once delete protection is turned off in the resource, the operator deletes
  the namespace and Kubernetes removes the resource. Run with
  `make test-cloud`.

depends:
  - name: temporal-cloud

defaults:
  kube:
    context: $TEST_KUBE_CONTEXT
    namespace: tco-test-cloud-ns-protect

tests:
 - name: operator-api-key
   kube:
     namespace: temporal-cloud-operator
     apply: manifests/operator/api-key.yaml

 - name: operator-ready
   kube:
     namespace: temporal-cloud-operator
     get: deployments/temporal-cloud-operator
   timeout: 3m
   retry:
     interval: 5s
   require:
     conditions:
       available: true

 - name: create
   kube.create: manifests/namespace/protect.yaml

 - name: active
   kube.get: namespaces.cloud.temporal.io/tro-e2e-${RUN_ID}-ns-protect
   timeout: 10m
   retry:
     interval: 15s
   assert:
     matches:
       status:
         resource:
           state: Active
   var:
     RESOURCE_ID:
       from: $.status.resource.id

 - name: protected-in-cloud
   exec: temporal-cloud namespace get --namespace $$RESOURCE_ID --output json
   timeout: 2m
   retry:
     interval: 15s
   assert:
     out:
       contains: '"enableDeleteProtection": true'

 - name: delete
   kube.delete: namespaces.cloud.temporal.io/tro-e2e-${RUN_ID}-ns-protect

 - name: delete-blocked
   kube.get: namespaces.cloud.temporal.io/tro-e2e-${RUN_ID}-ns-protect
   timeout: 2m
   retry:
     interval: 15s
   assert:
     conditions:
       stalled:
         status: true
         reason: ResourceDeleteFailed

 - name: kept-in-cloud
   exec: temporal-cloud namespace get --namespace $$RESOURCE_ID --output json
   assert:
     out:
       contains: RESOURCE_STATE_ACTIVE

 - name: unprotect
   kube.apply: manifests/namespace/protect-off.yaml

 - name: deleted
   kube.get: namespaces.cloud.temporal.io
   timeout: 15m
   retry:
     interval: 15s
   assert:
     len: 0

 - name: deleted-in-cloud
   exec: temporal-cloud namespace get --namespace $$RESOURCE_ID
   timeout: 2m
   retry:
     interval: 15s
   assert:
     exit-code: 1
     err:
       contains: NotFound
