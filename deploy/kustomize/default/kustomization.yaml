# Labels to add to all resources and selectors.
labels:
- pairs:
    control-plane: controller-manager
    app.kubernetes.io/name: temporal-cloud-operator
    app.kubernetes.io/managed-by: kustomize

resources:
- namespace.yaml
- ../crd
- ../rbac
- ../cloud-operator
