apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-cloud-operator
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: temporal-cloud-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: cloud-operator
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: temporal-cloud-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity
      # expression according to the platforms which are supported by your
      # solution.
      #
      # It is considered best practice to support multiple architectures. You
      # can build your manager image using the makefile target docker-buildx.
      #
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod
        # Security Standards. This ensures that deployments meet the highest
        # security requirements for Kubernetes.
        # For more details, see:
        # https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /bin/cloud-operator
        args:
        - --logging-format=json
        - --logging-level=info
        - --leader-election-enabled=false
        image: temporalio/cloud-operator:latest
        name: cloud-operator
        ports: []
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: temporal-cloud-operator
      terminationGracePeriodSeconds: 10
