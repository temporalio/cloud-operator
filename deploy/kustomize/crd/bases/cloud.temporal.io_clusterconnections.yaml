---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: clusterconnections.cloud.temporal.io
spec:
  group: cloud.temporal.io
  names:
    kind: ClusterConnection
    listKind: ClusterConnectionList
    plural: clusterconnections
    singular: clusterconnection
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Temporal Cloud API server host:port
      jsonPath: .spec.hostPort
      name: Endpoint
      type: string
    - description: Age
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterConnection is the cluster-scoped analog of Connection.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ConnectionSpec describes the desired configuration of a Connection to a
              Temporal Cloud API server. It describes where credentials can be found for
              instantiating a Temporal Cloud client object to that Temporal Cloud API
              server.
            properties:
              credentials:
                description: |-
                  Credentials contains desired configuration for the Temporal Cloud client
                  credentials.
                properties:
                  apiKey:
                    description: |-
                      APIKey contains the optional configuration for connecting to a Temporal
                      API server using Temporal API Key authentication.
                    properties:
                      path:
                        description: Path is the local file path in the Pod where
                          the API Key can be found.
                        type: string
                      secretRef:
                        description: |-
                          SecretRef selects the Secret key that contains the API key used for
                          authentication.

                          The Secret must be `type: kubernetes.io/opaque` and must exist in the
                          same Kubernetes namespace as the Connection resource.

                          SecretKeySelector encodes both:
                            - LocalObjectReference.Name: the name of the Secret resource
                            - Key: the data key within Secret.Data whose value is the API key token
                        properties:
                          key:
                            description: The key of the secret to select from.  Must
                              be a valid secret key.
                            type: string
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the Secret or its key must
                              be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                    x-kubernetes-validations:
                    - message: Only one of secretRef or path may be set
                      rule: has(self.secretRef) != has(self.path)
                required:
                - apiKey
                type: object
              hostPort:
                description: |-
                  HostPort is the host:port of the Temporal Cloud API server endpoint to
                  connect to.

                  Defaults to "saas-api.tmprl.cloud:443"

                  This is a gRPC address and therefore can also support a
                  special-formatted address of "<resolver>:///<value>" that will use a
                  registered resolver. By default all hosts returned from the resolver
                  will be used in a round-robin fashion.

                  The "dns" resolver is registered by and used by default.
                type: string
              tls:
                description: TLS configures TLS behaviour for the Temporal Cloud server
                  connection.
                properties:
                  caCert:
                    description: |-
                      CACert defines where to find the certificate authority (CA) certificate
                      to use for a Connection. This certificate is appended to/ the system
                      trust store for the Connection.

                      Note that this is only applicable when the Connection uses API Key or no
                      authentication credentials. When using Mutual TLS authentication, the CA
                      certificate is configured using the MutualTLSConfig struct.
                    properties:
                      path:
                        description: |-
                          Path contains the path in the local Pod filesystem where the CA
                          certificate file can be found.

                          Use Path when the CA certificate file contents are managed by an
                          external system or sidecar.
                        type: string
                      secretRef:
                        description: |-
                          SecretRef references a Kubernetes Secret that is either `type: opaque`
                          or `type: kubernetes.io/tls`.

                          When the Secret type is `opaque`, the `SecretKeySelector.type` field
                          should contain the key in the Secret data where the CA certificate file
                          contents can be found.

                          When the Secret type is `kubernetes.io/tls`, the
                          `SecretKeySelector.type` field is ignored. The CA certificate file
                          contents should be at the  standard `ca.crt` key location in the Secret
                          data.

                          More information about creating a TLS secret:
                          https://kubernetes.io/docs/concepts/configuration/secret/#tls-secrets
                        properties:
                          key:
                            description: The key of the secret to select from.  Must
                              be a valid secret key.
                            type: string
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the Secret or its key must
                              be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                  serverName:
                    description: |-
                      ServerName overrides the server name used to verify the Temporal server
                      certificate when TLS is enabled.
                    pattern: ^[a-zA-Z0-9.-]+$
                    type: string
                type: object
            required:
            - credentials
            type: object
          status:
            description: ConnectionStatus defines the observed state of a Connection
            properties:
              conditions:
                description: Conditions is the collection of Conditions associated
                  with the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
