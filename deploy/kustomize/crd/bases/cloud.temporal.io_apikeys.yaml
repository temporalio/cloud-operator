---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: apikeys.cloud.temporal.io
spec:
  group: cloud.temporal.io
  names:
    kind: APIKey
    listKind: APIKeyList
    plural: apikeys
    singular: apikey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.resource.id
      name: ID
      type: string
    - jsonPath: .status.resource.state
      name: State
      type: string
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.expiryTime
      name: Expiry
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: APIKey represents an instance of a Temporal Cloud API Key.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of the API Key.
            properties:
              description:
                description: |-
                  Description is a human readable description of the API Key.
                  Maps to Temporal Cloud proto `ApiKeySpec.description`.
                type: string
              disabled:
                description: |-
                  Disabled turns the API Key off without deleting it.
                  Maps to Temporal Cloud proto `ApiKeySpec.disabled`.
                type: boolean
              displayName:
                description: |-
                  DisplayName is the mutable name of the API Key in Temporal Cloud.
                  It does not have to be unique.
                  Maps to Temporal Cloud proto `ApiKeySpec.display_name`.
                minLength: 1
                type: string
              expiryTime:
                description: |-
                  ExpiryTime is when the API Key stops working.
                  Maps to Temporal Cloud proto `ApiKeySpec.expiry_time`.
                format: date-time
                type: string
              owner:
                description: |-
                  Owner is the identity the API Key authenticates as. It must be a Service
                  Account and cannot be changed after creation.
                  Maps to Temporal Cloud proto `ApiKeySpec.owner_id` and
                  `ApiKeySpec.owner_type`.
                properties:
                  serviceAccount:
                    description: |-
                      ServiceAccount is the Service Account that owns the API Key. A user
                      owner is not supported as Temporal Cloud only lets users create API Keys
                      for themselves. Since the operator  is designed to run under a service
                      account, it can only create API Keys owned by a Service Account.
                    properties:
                      id:
                        description: ID is the Temporal Cloud resource identifier.
                        type: string
                      ref:
                        description: Ref is an optional field that points at a cloud.temporal.io
                          custom resource
                        properties:
                          name:
                            description: Name is the name of the custom resource.
                            type: string
                          namespace:
                            description: |-
                              Namespace contains the optional Kubernetes Namespace in which to find
                              the custom resource. If empty, the Kubernetes Namespace containing the
                              referring object is used.
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of ref or id must be set
                      rule: has(self.ref) != has(self.id)
                required:
                - serviceAccount
                type: object
              token:
                description: |-
                  Token is where the API Key's token is stored. When the operator creates
                  the API Key, it writes the token there. It cannot be changed after
                  creation.
                properties:
                  secretKeyRef:
                    description: |-
                      SecretKeyRef is the key of a Kubernetes Secret, in the same Kubernetes
                      Namespace as the API Key.
                    properties:
                      key:
                        default: token
                        description: Key is the key in the Secret's data.
                        type: string
                      name:
                        description: Name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretKeyRef
                type: object
            required:
            - displayName
            - expiryTime
            - owner
            type: object
            x-kubernetes-validations:
            - fieldPath: .owner
              message: owner cannot be changed after creation
              rule: self.owner == oldSelf.owner
            - fieldPath: .token
              message: token cannot be added, changed or removed after creation
              rule: has(self.token) == has(oldSelf.token) && (!has(self.token) ||
                self.token == oldSelf.token)
          status:
            description: Status describes the current status of the API Key.
            properties:
              conditions:
                description: Conditions is the collection of Conditions associated
                  with the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              references:
                description: |-
                  References contains the Temporal Cloud IDs of the custom resources
                  referenced by the spec.
                properties:
                  serviceAccount:
                    description: |-
                      ServiceAccount is the owning Service Account CR with its Temporal Cloud
                      ID. It isn't set until that Service Account has an ID.
                    properties:
                      id:
                        description: ID is the Temporal Cloud resource identifier.
                        type: string
                      name:
                        description: Name is the Kubernetes Name of the Service Account
                          CR.
                        type: string
                      namespace:
                        description: Namespace is the Kubernetes Namespace containing
                          the Service Account CR.
                        type: string
                    required:
                    - id
                    - name
                    - namespace
                    type: object
                type: object
              resource:
                description: |-
                  Resource contains common information about the Temporal Cloud resource
                  that this CR represents.
                properties:
                  asyncOperationID:
                    description: |-
                      asyncOperationID is an optional field that contains the ID of the last
                      async operation on this resource that was NOT in a terminal state
                      (FAILED, COMPLETED, FULFILLED,REJECTED) when this reconcile loop
                      executed.

                      The reconciler removes this field when it determines the operation has
                      reached a terminal state.

                      Maps to Temporal Cloud proto `async_operation_id`.
                    type: string
                  createdTime:
                    description: |-
                      CreatedTime is when the resource was created in Temporal Cloud.
                      Maps to Temporal Cloud proto `created_time`.
                    format: date-time
                    type: string
                  id:
                    description: |-
                      ID is the identifier Temporal Cloud uses for the resource. Not set for
                      resources that Temporal Cloud identifies by name.
                      Maps to Temporal Cloud proto `id`, or `Namespace.namespace` for
                      Namespaces.
                    type: string
                  lastModifiedTime:
                    description: |-
                      LastModifiedTime is when the resource was last modified in Temporal
                      Cloud.
                      Maps to Temporal Cloud proto `last_modified_time`.
                    format: date-time
                    type: string
                  state:
                    description: |-
                      State is the state of the resource in Temporal Cloud.
                      Maps to Temporal Cloud proto `state`.
                    enum:
                    - Activating
                    - ActivationFailed
                    - Active
                    - Updating
                    - UpdateFailed
                    - Deleting
                    - DeleteFailed
                    - Deleted
                    - Suspended
                    - Expired
                    type: string
                  version:
                    description: |-
                      Version is the version of the resource in Temporal Cloud. It is
                      sent with each update and delete request.
                      Maps to Temporal Cloud proto `resource_version`.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
