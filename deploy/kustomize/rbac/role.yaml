---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: temporal-cloud-operator
rules:
- apiGroups:
  - cloud.temporal.io
  resources:
  - namespaces
  - projects
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cloud.temporal.io
  resources:
  - namespaces/finalizers
  - projects/finalizers
  - serviceaccounts/finalizers
  verbs:
  - update
- apiGroups:
  - cloud.temporal.io
  resources:
  - namespaces/status
  - projects/status
  - serviceaccounts/status
  verbs:
  - get
  - patch
  - update
