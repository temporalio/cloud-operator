# Passes: adopt-or-create with a resource ID and a full spec to create from.
apiVersion: cloud.temporal.io/v1alpha1
kind: Namespace
metadata:
  name: adopt-or-create
  annotations:
    cloud.temporal.io/adoption-policy: adopt-or-create
    cloud.temporal.io/resource-id: adopt-or-create.abc12
spec:
  replicas:
    - region: aws-us-west-2
  retentionDays: 30
  apiKeyAuth:
    enabled: true
