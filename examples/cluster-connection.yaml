# The default connection to the Temporal Cloud API. This is the same
# ClusterConnection that deploy/kustomize/overlays/default-connection installs.
#
# The API key is read from the `apikey` entry of the Secret
# temporal-cloud-api-key in the operator's Kubernetes Namespace. To create the
# Secret, run:
#
#   kubectl create secret generic temporal-cloud-api-key \
#     -n temporal-cloud-operator --from-literal=apikey="$TEMPORAL_CLOUD_API_KEY"
#
# To make this the default connection, set DEFAULT_CLOUD_CONNECTION_NAME=default
# on the operator. See docs/install.md.
apiVersion: cloud.temporal.io/v1alpha1
kind: ClusterConnection
metadata:
  name: default
spec:
  hostPort: saas-api.tmprl.cloud:443
  credentials:
    apiKey:
      secretRef:
        name: temporal-cloud-api-key
        key: apikey
