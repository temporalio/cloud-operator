# An example Temporal Cloud Namespace. To create it, run:
#
#   kubectl apply -n <kubernetes-namespace> -f examples/namespace.yaml
#
# metadata.name is used as the Temporal Cloud Namespace name. To list all spec
# fields, run:
#
#   kubectl explain namespaces.spec --api-version=cloud.temporal.io/v1alpha1
apiVersion: cloud.temporal.io/v1alpha1
kind: Namespace
metadata:
  name: payments-prod
spec:
  # The project to create the Namespace in. If not set, the account's default
  # project is used. Cannot be changed after creation.
  # projectID: <project-id>
  tags:
    environment: production
    team: payments
  replicas:
    - region: aws-us-west-2
  retentionDays: 30
  apiKeyAuth:
    enabled: true
  capacity:
    onDemand: {}
  description: Payment workflows for production.
