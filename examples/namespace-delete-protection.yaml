apiVersion: cloud.temporal.io/v1alpha1
kind: Namespace
metadata:
  name: payments-protected
spec:
  tags:
    environment: production
    team: payments
  replicas:
    - region: aws-us-west-2
  retentionDays: 30
  apiKeyAuth:
    enabled: true
  capacity:
    onDemand: {}
  lifecycle:
    enableDeleteProtection: true
  description: Payment workflows with delete protection enabled.
