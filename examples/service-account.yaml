# An example Temporal Cloud Service Account with Write access to the Namespace
# in examples/namespace.yaml. Create the Namespace first, in the same
# Kubernetes Namespace, then run:
#
#   kubectl apply -n <kubernetes-namespace> -f examples/service-account.yaml
#
# To list all spec fields, run:
#
#   kubectl explain serviceaccounts.spec --api-version=cloud.temporal.io/v1alpha1
apiVersion: cloud.temporal.io/v1alpha1
kind: ServiceAccount
metadata:
  name: payments-worker
spec:
  displayName: payments-worker
  description: Runs payment workers against payments-prod.
  namespaceScopedAccess:
    namespace:
      # Points at the cloud.temporal.io/Namespace named payments-prod. To use
      # an existing Temporal Cloud Namespace instead, replace ref with its
      # identifier, for example:
      #   id: payments-prod.a1b2c
      ref:
        name: payments-prod
    access:
      permission: Write
